[package]
name = "packed-core"
version = "0.1.0"
edition = "2021"
description = "packed archive engine: detect, list, extract and create archives — one implementation for all platforms"
license = "MIT"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto", "time"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
zstd = "0.13"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# atomic archive rewrites (edit.rs): temp file in the target dir + persist
tempfile = "3"
